<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CriticX TV Admin Login</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <img src="../assets/logo.png"
                 class="logo"
                 alt="CriticX TV">

            <h1>CriticX TV</h1>

            <h3>Admin Panel</h3>

            <input
                type="email"
                id="email"
                placeholder="Admin Email">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <button id="loginBtn">

                Login

            </button>

            <p id="message"></p>

            <small>

                Powered by Firebase

            </small>

        </div>

    </div>

    <script type="module" src="login.js"></script>

</body>

</html>
