<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CriticX TV Admin</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="dashboard">

    <header class="topbar">

        <h2>📺 CriticX TV Admin Panel</h2>

        <button id="logoutBtn">Logout</button>

    </header>


    <div class="stats">

        <div class="stat-card">

            <h3>Total Downloads</h3>

            <h1 id="downloads">0</h1>

        </div>

        <div class="stat-card">

            <h3>Total Visitors</h3>

            <h1 id="visitors">0</h1>

        </div>

    </div>


    <div class="form-card">

        <h2>Website Information</h2>

        <label>App Name</label>

        <input
            id="appName"
            type="text">

        <label>Version</label>

        <input
            id="version"
            type="text">

        <label>Updated</label>

        <input
            id="updated"
            type="text">

        <label>APK URL</label>

        <input
            id="apkUrl"
            type="text">

        <label>Description</label>

        <textarea
            id="description"
            rows="5"></textarea>

        <label>Latest Update</label>

        <textarea
            id="latest"
            rows="5"></textarea>

        <label>Messenger Link</label>

        <input
            id="messenger"
            type="text">

        <label>Telegram Link</label>

        <input
            id="telegram"
            type="text">

        <button id="saveBtn">

            💾 Save Changes

        </button>

    </div>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
